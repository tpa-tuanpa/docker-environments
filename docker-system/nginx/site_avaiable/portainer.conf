server {
    listen 80;
    server_name portainer.local;

    # Tăng kích thước upload nếu cần upload file/image lên Portainer
    client_max_body_size 500M;

    location / {
        # Nếu Portainer của bạn chạy cổng 9000 (HTTP)
        proxy_pass http://portainer:9000;

        proxy_http_version 1.1;

        # --- BẮT BUỘC: Các header để hỗ trợ WebSocket cho Portainer Action ---
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # --- Các header định danh client ---
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tắt buffering để gửi/nhận dữ liệu thời gian thực ngay lập tức
        proxy_buffering off;
        proxy_read_timeout 86400s; # Giữ kết nối WebSocket không bị timeout disconnect
    }
}
