services:
  global_db:
    image: mariadb:11
    container_name: ${GLOBAL_DB}
    environment:
      MARIADB_ROOT_PASSWORD: ${GLOBAL_DB_ROOT_PASSWORD}
    networks:
      - ${GLOBAL_NETWORK}
    volumes:
      - ./mariadb/data:/var/lib/mysql

  global_proxy:
    image: nginx:alpine
    container_name: ${GLOBAL_SERVER}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/logs:/var/log/nginx
    networks:
      - ${GLOBAL_NETWORK}

networks:
  global_network:
    name: ${GLOBAL_NETWORK} # Đặt tên cố định để các dự án con dễ gọi
    driver: bridge

volumes:
  portainer_data:
